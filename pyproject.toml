[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystatsclinical"
version = "0.1.0"
description = "Clinical-trial and clinical-research statistical computing for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Hai-Shuo", email = "contact@sgcx.org" },
]
keywords = [
    "clinical-trials",
    "biostatistics",
    "clinical-research",
    "epidemiology",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://sgcx.org/technology/pystatsclinical/"
Documentation = "https://sgcx.org/docs/pystatsclinical/"
Repository = "https://github.com/sgcx-org/pystatsclinical"
Issues = "https://github.com/sgcx-org/pystatsclinical/issues"

[tool.hatch.build.targets.wheel]
packages = ["pystatsclinical"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict = true
